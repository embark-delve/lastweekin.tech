repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^tests/
        additional_dependencies: ["bandit[toml]"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Generated output: the pipeline writes these, prettier would fight it.
        exclude: ^(index\.html|style\.css|archive/|data/)
        additional_dependencies:
          - prettier@3.6.2
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        # Imported source material, converted from the original documents.
        exclude: ^docs/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # Generated output quotes headlines from feeds we do not control.
        exclude: ^(package-lock\.json|uv\.lock|data/|archive/|index\.html|docs/)
        additional_dependencies: ["tomli"]
  # Run mypy in the project environment rather than an isolated one, so it sees
  # the same installed packages (and therefore the same inferences) as CI.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
