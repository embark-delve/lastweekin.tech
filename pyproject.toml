[project]
name = "lastweekintech"
version = "0.1.0"
description = "Automation pipeline and assets for the LastWeekIn.Tech weekly news digest."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "LastWeekIn.Tech Maintainers" }
]
dependencies = [
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "lxml[html-clean]>=5.2",
  "newspaper3k>=0.2.8",
  "nltk>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.4",
  "pre-commit>=4.3.0",
  "python-dateutil>=2.9",
  "pytz>=2024.1",
  "pyyaml>=6.0.3",
  "requests>=2.32",
  "ruamel-yaml>=0.18",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "thefuzz[speedup]>=0.22.1",
  "tldextract>=5.1",
  "tqdm>=4.66",
  "typer>=0.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.9",
  "coverage>=7.6",
  "mypy>=1.10",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6.3"
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastweekintech"]

[tool.hatch.build.targets.sdist]
include = ["src/lastweekintech", "README.md", "pyproject.toml", "docs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "S",
  "C4",
  "RUF"
]
ignore = [
  "S101"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/lastweekintech"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
