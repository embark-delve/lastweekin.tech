[tool.poetry]
name = "lastweekintech"
version = "0.1.0"
description = "A weekly tech digest generator."
authors = ["Your Name <you@example.com>"]
packages = [{include = "lastweekintech", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.9.0"
requests = "^2.31.0"
feedparser = "^6.0.10"
newspaper3k = "^0.2.8"
pyyaml = "^6.0.1"
"ruamel.yaml" = "^0.18.6"
beautifulsoup4 = "^4.12.3"
lxml = "^5.2.1"
numpy = "^1.26.4"
scikit-learn = "^1.4.2"
pandas = "^2.2.2"
ipykernel = "^6.29.4"


[tool.poetry.dev-dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
